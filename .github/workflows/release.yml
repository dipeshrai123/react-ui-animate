name: Release

on:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Tags (refs/tags/*) aren't covered by branch protection on
      # main/next (that only guards refs/heads/*), so the default
      # GITHUB_TOKEN can push the release tag without needing a bypass.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No registry-url here: it would pre-write an .npmrc expecting
      # NODE_AUTH_TOKEN, which @semantic-release/npm would then read
      # instead of writing its own auth from NPM_TOKEN, and fail with a
      # blank/invalid token. Let the npm plugin manage registry auth.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test -- --ci

      - run: npm run build

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
